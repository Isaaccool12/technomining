name: Разбор www

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dump:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: backup
          path: src
      - name: Выгрузить index.html
        run: |
          set +e
          F=$(ls src/*.apk | head -1)
          echo "APK: $F"
          OUT=docs/apk-inspect/www
          rm -rf "$OUT" && mkdir -p "$OUT"
          unzip -p "$F" assets/www/index.html > "$OUT/index.html.txt"
          wc -c "$OUT/index.html.txt"
          split -b 120000 -d -a 2 "$OUT/index.html.txt" "$OUT/part-"
          python3 - "$OUT/index.html.txt" "$OUT/outline.txt" <<'PY'
          import re, sys
          s = open(sys.argv[1], encoding="utf-8", errors="replace").read()
          out = []
          def block(name, items):
              out.append("== %s: %d ==" % (name, len(items)))
              out.extend(items)
              out.append("")
          block("IDS", sorted(set(re.findall(r'id="([^"]+)"', s))))
          block("FUNCS", sorted(set(re.findall(r'function\s+([A-Za-z_$][\w$]*)\s*\(', s))))
          block("ARROWS", sorted(set(re.findall(r'(?:const|let|var)\s+([A-Za-z_$][\w$]*)\s*=\s*(?:async\s*)?\([^)]*\)\s*=>', s))))
          block("STORAGE", sorted(set(re.findall(r"localStorage[^\n]{0,90}", s)))[:200])
          block("DATAKEYS", sorted(set(re.findall(r"[\"']([A-Za-z_][A-Za-z0-9_]{2,24})[\"']\s*:", s)))[:500])
          lab = re.findall(r"[\"']([^\"'\n]{2,70})[\"']", s)
          ru = sorted({x.strip() for x in lab if re.search("[А-Яа-яЁё]", x)})
          block("RU", ru[:900])
          text = "\n".join(out)
          open(sys.argv[2], "w", encoding="utf-8").write(text)
          print("outline bytes:", len(text))
          PY
          ls -la "$OUT"
          git config user.name www-dump
          git config user.email noreply@users.noreply.github.com
          git add docs/apk-inspect
          git commit -m "www: index.html и оглавление" || true
          git push || true
