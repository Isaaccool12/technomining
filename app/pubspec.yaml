name: engineer
description: Приложение сервисного инженера ТехноМайнинг.
publish_to: none
version: 0.4.1-test+5

environment:
  sdk: ^3.8.0
  flutter: ">=3.32.0"

dependencies:
  archive: ^4.0.7
  drift: ^2.28.0
  file_picker: ^10.3.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.0.0
  go_router: ^16.0.0
  image_picker: ^1.1.2
  intl: any
  path: ^1.9.0
  path_provider: ^2.1.5
  pdf: ^3.11.3
  share_plus: ^11.0.0
  sqlite3: ^2.9.0
  sqlite3_flutter_libs: ^0.5.39
  uuid: ^4.5.1
  webview_flutter: ^4.13.0

# image (через pdf) вызывает ZLibDecoder.decodeLazy из новых версий archive,
# а решатель оставлял archive 4.0.9. Поднимаем archive принудительно.
dependency_overrides:
  archive: ^4.0.10

dev_dependencies:
  build_runner: ^2.5.0
  drift_dev: ^2.28.0
  flutter_test:
    sdk: flutter
  very_good_analysis: ^9.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/fonts/DejaVuSans.ttf
    - assets/fonts/DejaVuSans-Bold.ttf
